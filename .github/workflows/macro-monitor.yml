name: Macro Telegram Monitor

on:
  schedule:
    # GitHub Actions uses UTC, while the target windows are anchored to New York time.
    # The script sends only if the current New York time is inside a target window.
    # US daylight time: 08:40, 10:40, 14:40, 20:40 New York.
    - cron: "40 0,12,14,18 * * *"
    # US standard time: 08:40, 10:40, 14:40, 20:40 New York.
    - cron: "40 1,13,15,19 * * *"
  workflow_dispatch:

jobs:
  send-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run monitor and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/macro_monitor.py
